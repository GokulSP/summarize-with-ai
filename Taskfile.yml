version: "3"

# Gate tasks come from ../dev-env/gates; `task --list` shows them all. test:js stays local - the
# userscript's coverage needs explicit --coverage.include globs (see conformance-waivers.toml).
vars:
  LANGS: js

includes:
  base: {taskfile: ../dev-env/gates/taskfile/base.yml, flatten: true}
  js: {taskfile: ../dev-env/gates/taskfile/js.yml, flatten: true, excludes: [test:js]}

tasks:
  test:js:
    desc: Vitest with coverage scoped to the userscript and its build scripts
    cmds:
      - >-
        pnpm exec vitest run --coverage --coverage.include="*.user.js"
        --coverage.include="scripts/*.js" --coverage.reporter=text
        --coverage.thresholds.lines=80 --coverage.thresholds.branches=80 {{.CLI_ARGS}}

  test:e2e:
    desc: Playwright in Edge on a page whose CSS fights the UI; scope with -- -g <name>
    cmds:
      - pnpm exec playwright test {{.CLI_ARGS}}

  sync:metadata:
    desc: Regenerate the userscript metadata block
    cmds:
      # pnpm exec runs the Node that devEngines pins, not whatever is on PATH
      - pnpm exec node scripts/sync-metadata.js
